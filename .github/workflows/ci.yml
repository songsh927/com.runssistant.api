name: CI

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: runcoach
          POSTGRES_PASSWORD: runcoach
          POSTGRES_DB: runcoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff format + check)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://runcoach:runcoach@localhost:5432/runcoach
          DATABASE_URL_TEST: postgresql+asyncpg://runcoach:runcoach@localhost:5432/runcoach_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: ci-test-secret-key
          LLM_PROVIDER: ollama
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -v
